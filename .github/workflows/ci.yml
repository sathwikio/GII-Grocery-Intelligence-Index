name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Ruff Linter
        run: ruff check src tests jobs streamlit_app.py
      - name: Ruff Formatter Check
        run: ruff format --check src tests jobs streamlit_app.py

  test:
    name: PySpark Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java (for local PySpark execution)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run PySpark Tests with Coverage
        env:
          PYSPARK_SUBMIT_ARGS: "--packages io.delta:delta-spark_2.12:3.2.0 --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog pyspark-shell"
        run: |
          pytest --cov=grocery_index --cov-report=term-missing --cov-report=xml
      - name: Verify CLI Local Execution
        env:
          PYSPARK_SUBMIT_ARGS: "--packages io.delta:delta-spark_2.12:3.2.0 --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog pyspark-shell"
        run: |
          python -m grocery_index.cli run --env local

  bundle-validate:
    name: Databricks Asset Bundle Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate Bundle Configurations & Job YAMLs
        run: |
          python -c "
          import yaml, glob
          for yml_file in ['databricks.yml'] + glob.glob('resources/*.yml'):
              with open(yml_file) as f:
                  yaml.safe_load(f)
              print(f'✓ Validated {yml_file}')
          "
